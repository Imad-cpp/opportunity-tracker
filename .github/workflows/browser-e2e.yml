name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1-workflow:
    name: V1 browser workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build and start application stack
        run: docker compose up --build --detach
      - name: Run database migrations
        run: docker compose exec -T api php artisan migrate --force
      - name: Wait for web and API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/live >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api web
          exit 1
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install isolated Playwright test runner
        working-directory: apps/web
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.62.0
      - name: Install Chromium runtime
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run V1 browser workflow
        working-directory: apps/web
        env:
          CI: 'true'
        run: npx playwright test e2e/v1-workflow.spec.ts --workers=1 --reporter=line
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans
