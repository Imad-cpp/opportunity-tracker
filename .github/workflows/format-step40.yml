name: Format Step 40

on:
  push:
    branches:
      - feat/search-filters-deadlines
    paths:
      - .github/workflows/format-step40.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/search-filters-deadlines
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply Pint
        working-directory: apps/api
        run: vendor/bin/pint
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-step40.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format search and deadline implementation'
          git push origin HEAD:feat/search-filters-deadlines
