name: One-off dependency refresh

on:
  push:
    branches:
      - chore/dependency-maintenance

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: chore/dependency-maintenance
          fetch-depth: 0
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify target packages exist
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          test "$(npm view next@16.3.1 version)" = '16.3.1'
          test "$(npm view eslint-config-next@16.3.1 version)" = '16.3.1'
      - name: Refresh locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set dependencies.next='16.3.1'
          npm pkg set devDependencies.eslint-config-next='16.3.1'
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Verify resolved security chain
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const expected = {
            next: '16.3.1',
            postcss: '8.5.23',
            sharp: '0.35.3',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = packages[`node_modules/${name}`]?.version;
            if (actual !== version) throw new Error(`${name}: expected ${version}, got ${actual}`);
          }
          NODE
          npm audit --omit=dev --audit-level=high
      - name: Verify web application
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit locked dependency refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --check
          git commit -m 'chore: refresh web security dependencies'
          git push origin HEAD:chore/dependency-maintenance
