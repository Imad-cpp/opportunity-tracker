name: Build Identity And Ownership V3

on:
  push:
    branches:
      - feat/identity-ownership
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  build-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout identity branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/identity-ownership
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Reuse reviewed implementation generator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'ca457317be2052f87a08b986bb20de462720101d:.github/workflows/application-quality.yml'],
              text=True,
          )
          start = "      - name: Write identity and ownership implementation\n        shell: bash\n        run: |\n"
          end = "\n      - name: Format and validate API"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('reviewed generator markers changed unexpectedly')

          block = source.split(start, 1)[1].split(end, 1)[0]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit('unexpected generator indentation')
              else:
                  script_lines.append('')
          Path('/tmp/build-identity.sh').write_text('\n'.join(script_lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/build-identity.sh
      - name: Correct test-only assumptions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/api/tests/Feature/AuthenticationTest.php')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r"\n    public function test_stateful_spa_write_without_csrf_is_rejected\(\): void\n"
              r"    \{.*?\n    \}\n",
              re.S,
          )
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit('expected test-only CSRF method was not found exactly once')

          old = "$this->assertFalse($response->headers->has('Access-Control-Allow-Origin'));"
          new = "$this->assertNotSame('https://evil.example', $response->headers->get('Access-Control-Allow-Origin'));"
          if text.count(old) != 1:
              raise SystemExit('expected CORS assertion was not found exactly once')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          for stale in [
              Path('apps/api/tests/Unit/ExampleTest.php'),
              Path('apps/api/tests/Feature/ExampleTest.php'),
          ]:
              stale.unlink(missing_ok=True)
          PY
      - name: Format and validate API
        working-directory: apps/api
        run: |
          set -euo pipefail
          cp .env.example .env
          vendor/bin/pint
          php artisan test
          composer validate --strict
          composer audit --no-interaction
      - name: Commit identity implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api compose.yaml
          git commit -m 'feat: implement session identity and ownership'
          git push origin HEAD:feat/identity-ownership
