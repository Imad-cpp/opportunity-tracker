name: Build Identity And Ownership

on:
  push:
    branches:
      - feat/identity-ownership
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  build-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout identity branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/identity-ownership
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Write identity and ownership implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = {
