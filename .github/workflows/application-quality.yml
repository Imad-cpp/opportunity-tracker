name: Build Opportunity CRUD V4

on:
  push:
    branches:
      - feat/opportunity-crud
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  build-crud:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CRUD branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/opportunity-crud
          fetch-depth: 0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Execute reviewed CRUD generator
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ['git', 'show', 'a8a6412d06032edd955e1adc740fa80d10f722b3:.github/workflows/application-quality.yml'],
              text=True,
          )
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n      - name: Format and validate CRUD"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('reviewed CRUD generator markers changed unexpectedly')

          raw = source.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          Path('/tmp/build-crud.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/build-crud.py
      - name: Apply reviewed regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          bootstrap = Path('apps/api/bootstrap/app.php')
          text = bootstrap.read_text(encoding='utf-8')
          old_import = 'use Illuminate\\Database\\Eloquent\\ModelNotFoundException;\n'
          new_import = 'use Symfony\\Component\\HttpKernel\\Exception\\NotFoundHttpException;\n'
          old_handler = 'function (ModelNotFoundException $exception, Request $request)'
          new_handler = 'function (NotFoundHttpException $exception, Request $request)'
          if text.count(old_import) != 1 or text.count(old_handler) != 1:
              raise SystemExit('generated not-found handler shape changed unexpectedly')
          text = text.replace(old_import, new_import, 1).replace(old_handler, new_handler, 1)
          bootstrap.write_text(text, encoding='utf-8')

          ownership = Path('apps/api/tests/Feature/OwnershipScopeTest.php')
          text = ownership.read_text(encoding='utf-8')
          old = """return Opportunity::query()->create([
            'owner_id' => $owner->getKey(),
            'type' => 'INTERNSHIP',"""
          new = """return $owner->opportunities()->create([
            'type' => 'INTERNSHIP',"""
          if text.count(old) != 1:
              raise SystemExit('ownership test helper shape changed unexpectedly')
          ownership.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and validate CRUD
        working-directory: apps/api
        run: |
          set -euo pipefail
          cp .env.example .env
          vendor/bin/pint
          php artisan test
          composer validate --strict
          composer audit --no-interaction
      - name: Commit CRUD implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'feat: implement owner-scoped opportunity CRUD'
          git push origin HEAD:feat/opportunity-crud
