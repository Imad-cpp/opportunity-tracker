name: Application Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Docs quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate project documentation
        run: python3 scripts/check-docs.py

  web-quality:
    name: Web quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  api-quality:
    name: API quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: opportunity_tracker_test
      DB_USERNAME: opportunity
      DB_PASSWORD: opportunity_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: opportunity_tracker_test
          POSTGRES_USER: opportunity
          POSTGRES_PASSWORD: opportunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity -d opportunity_tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Migrate PostgreSQL
        run: php artisan migrate --force
      - name: Check code style
        run: vendor/bin/pint --test
      - name: Run tests against PostgreSQL
        run: php artisan test
      - name: Audit Composer dependencies
        run: composer audit --no-interaction

  stack-smoke:
    name: Docker stack smoke
    needs:
      - docs-quality
      - web-quality
      - api-quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach
      - name: Run database migrations in container
        run: docker compose exec -T api php artisan migrate --force
      - name: Verify API and web surfaces
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/live > /tmp/api-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color api
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/api-health.json').read_text())
          assert payload == {'status': 'ok'}, payload
          PY

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/web.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color web
              exit 1
            fi
            sleep 2
          done

          grep -F 'Application workspace scaffold' /tmp/web.html
          echo 'STACK_SMOKE=PASS'
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans
