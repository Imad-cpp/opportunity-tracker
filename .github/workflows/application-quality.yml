name: Build Opportunity CRUD

on:
  push:
    branches:
      - feat/opportunity-crud
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  build-crud:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout CRUD branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/opportunity-crud
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Write CRUD implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = {
              'apps/api/app/Http/Requests/StoreOpportunityRequest.php': '''<?php

namespace App\\Http\\Requests;

use App\\Rules\\HttpUrl;
use Illuminate\\Foundation\\Http\\FormRequest;
use Illuminate\\Validation\\Rule;

class StoreOpportunityRequest extends FormRequest
{
    public function authorize(): bool
    {
        return true;
    }

    public function rules(): array
    {
        return [
            'type' => ['required', 'string', Rule::in(['JOB', 'INTERNSHIP', 'SCHOLARSHIP', 'PROGRAM', 'OTHER'])],
            'priority' => ['required', 'string', Rule::in(['LOW', 'MEDIUM', 'HIGH'])],
            'title' => ['required', 'string', 'max:200'],
            'organization' => ['required', 'string', 'max:200'],
            'source_url' => ['nullable', 'string', 'max:2048', new HttpUrl],
            'location' => ['nullable', 'string', 'max:200'],
            'notes' => ['nullable', 'string', 'max:10000'],
            'owner_id' => ['prohibited'],
            'status' => ['prohibited'],
            'deadline_at' => ['prohibited'],
            'deadline_precision' => ['prohibited'],
            'deadline_timezone' => ['prohibited'],
            'next_action' => ['prohibited'],
            'next_action_at' => ['prohibited'],
            'archived_at' => ['prohibited'],
        ];
    }

    protected function prepareForValidation(): void
    {
        $this->merge($this->normalizedInput());
    }

    private function normalizedInput(): array
    {
        $input = $this->all();

        foreach (['type', 'priority', 'title', 'organization', 'source_url', 'location', 'notes'] as $key) {
            if (! array_key_exists($key, $input) || ! is_string($input[$key])) {
                continue;
            }

            $value = trim($input[$key]);
            $input[$key] = in_array($key, ['source_url', 'location', 'notes'], true) && $value === '' ? null : $value;
        }

        return $input;
    }
}
