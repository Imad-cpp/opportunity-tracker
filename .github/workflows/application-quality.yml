name: Sync CRUD Changelog

on:
  push:
    branches:
      - feat/opportunity-crud
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean CRUD branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/opportunity-crud-clean
      - name: Append CRUD changelog entries
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '- Replaced generated placeholder API tests with synthetic identity and ownership coverage.\n'
          addition = (
              marker
              + '- Added authenticated opportunity create, list, detail, update, archive, restore and delete endpoints.\n'
              + '- Added type, priority, source URL and bounded text validation for ordinary opportunity edits.\n'
              + '- Added stable missing-resource behavior across opportunity reads and mutations.\n'
              + '- Kept status, deadline and next-action changes outside ordinary CRUD for their dedicated roadmap steps.\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('changelog marker changed unexpectedly')
          if 'Added authenticated opportunity create, list, detail' not in text:
              text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check-docs.py
      - name: Commit changelog sync
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'docs: add opportunity CRUD changelog'
          git push origin HEAD:feat/opportunity-crud-clean
