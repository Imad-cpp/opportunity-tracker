          'apps/api/tests/Feature/AuthenticationTest.php': r'''<?php

          namespace Tests\Feature;

          use App\Models\User;
          use Illuminate\Foundation\Http\Middleware\PreventRequestForgery;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Illuminate\Support\Str;
          use Tests\TestCase;

          class AuthenticationTest extends TestCase
          {
              use RefreshDatabase;

              protected function setUp(): void
              {
                  parent::setUp();

                  config([
                      'sanctum.stateful' => ['localhost:3000'],
                      'cors.allowed_origins' => ['http://localhost:3000'],
                  ]);
              }

              public function test_registration_normalizes_identity_and_starts_session(): void
              {
                  $this->withoutMiddleware(PreventRequestForgery::class);
                  $before = session()->getId();

                  $response = $this->spa()->postJson('/api/v1/auth/register', [
                      'name' => '  Test Student  ',
                      'email' => '  Student@Example.Test ',
                      'password' => 'Strong!Password123',
                      'timezone' => 'Africa/Casablanca',
                  ]);

                  $response->assertCreated()
                      ->assertJsonPath('data.name', 'Test Student')
                      ->assertJsonPath('data.email', 'student@example.test')
                      ->assertJsonPath('data.timezone', 'Africa/Casablanca');

                  $user = User::query()->firstOrFail();
                  $this->assertTrue(Str::isUuid((string) $user->getKey()));
                  $this->assertAuthenticatedAs($user);
                  $this->assertNotSame($before, session()->getId());
              }

              public function test_invalid_timezone_uses_stable_validation_error(): void
              {
                  $this->withoutMiddleware(PreventRequestForgery::class);

                  $this->spa()->postJson('/api/v1/auth/register', [
                      'name' => 'Test Student',
                      'email' => 'student@example.test',
                      'password' => 'Strong!Password123',
                      'timezone' => 'Mars/Olympus',
                  ])->assertUnprocessable()
                      ->assertJsonPath('error.code', 'VALIDATION_FAILED')
                      ->assertJsonPath('error.details.timezone.0', 'The timezone field must be a valid IANA time zone.');
              }

              public function test_login_regenerates_session_and_logout_invalidates_it(): void
              {
                  $this->withoutMiddleware(PreventRequestForgery::class);
                  $user = User::factory()->create([
                      'email' => 'student@example.test',
                      'password' => 'Strong!Password123',
                  ]);
                  $this->withSession(['marker' => 'before-login']);
                  $before = session()->getId();

                  $this->spa()->postJson('/api/v1/auth/login', [
                      'email' => 'Student@Example.Test',
                      'password' => 'Strong!Password123',
                  ])->assertOk()
                      ->assertJsonPath('data.id', (string) $user->getKey());

                  $this->assertAuthenticatedAs($user);
                  $this->assertNotSame($before, session()->getId());

                  $this->spa()->postJson('/api/v1/auth/logout')->assertNoContent();
                  $this->assertGuest();
              }

              public function test_failed_login_attempts_are_rate_limited_without_revealing_account_state(): void
              {
                  $this->withoutMiddleware(PreventRequestForgery::class);
                  User::factory()->create(['email' => 'student@example.test']);

                  for ($attempt = 0; $attempt < 5; $attempt++) {
                      $this->spa()->postJson('/api/v1/auth/login', [
                          'email' => 'student@example.test',
                          'password' => 'Wrong!Password123',
                      ])->assertUnprocessable()
                          ->assertJsonPath('error.code', 'INVALID_CREDENTIALS');
                  }

                  $this->spa()->postJson('/api/v1/auth/login', [
                      'email' => 'student@example.test',
                      'password' => 'Wrong!Password123',
                  ])->assertTooManyRequests()
                      ->assertJsonPath('error.code', 'RATE_LIMITED');
              }

              public function test_private_account_endpoint_returns_stable_unauthenticated_error(): void
              {
                  $this->spa()->getJson('/api/v1/me')
                      ->assertUnauthorized()
                      ->assertJsonPath('error.code', 'UNAUTHENTICATED');
              }

              public function test_stateful_spa_write_without_csrf_is_rejected(): void
              {
                  User::factory()->create(['email' => 'student@example.test']);

                  $this->spa()->postJson('/api/v1/auth/login', [
                      'email' => 'student@example.test',
                      'password' => 'Password!12345',
                  ])->assertStatus(419)
                      ->assertJsonPath('error.code', 'CSRF_TOKEN_MISMATCH');
              }

              public function test_sanctum_csrf_bootstrap_issues_xsrf_cookie(): void
              {
                  $this->spa()->get('/sanctum/csrf-cookie')
                      ->assertNoContent()
                      ->assertCookie('XSRF-TOKEN');
              }

              public function test_untrusted_origin_is_not_reflected_by_cors(): void
              {
                  $response = $this->withHeaders([
                      'Origin' => 'https://evil.example',
                      'Accept' => 'application/json',
                  ])->getJson('/api/v1/health/live');

                  $response->assertOk();
                  $this->assertFalse($response->headers->has('Access-Control-Allow-Origin'));
              }

              private function spa(): static
              {
                  return $this->withHeaders([
                      'Origin' => 'http://localhost:3000',
                      'Referer' => 'http://localhost:3000/',
                      'Accept' => 'application/json',
                  ]);
              }
          }
          ''',
          'apps/api/tests/Feature/OwnershipScopeTest.php': r'''<?php

          namespace Tests\Feature;

          use App\Models\Opportunity;
          use App\Models\User;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Tests\TestCase;

          class OwnershipScopeTest extends TestCase
          {
              use RefreshDatabase;

              public function test_opportunity_scope_never_returns_another_owners_record(): void
              {
                  $owner = User::factory()->create();
                  $other = User::factory()->create();

                  $owned = $this->opportunity($owner, 'Owned opportunity');
                  $foreign = $this->opportunity($other, 'Foreign opportunity');

                  $ids = Opportunity::query()
                      ->ownedBy($owner)
                      ->pluck('id')
                      ->all();

                  $this->assertSame([(string) $owned->getKey()], $ids);
                  $this->assertNotContains((string) $foreign->getKey(), $ids);
                  $this->assertSame((string) $owner->getKey(), (string) $owned->owner->getKey());
              }

              private function opportunity(User $owner, string $title): Opportunity
              {
                  return Opportunity::query()->create([
                      'owner_id' => $owner->getKey(),
                      'type' => 'INTERNSHIP',
                      'status' => 'SAVED',
                      'priority' => 'MEDIUM',
                      'title' => $title,
                      'organization' => 'Synthetic Organization',
                  ]);
              }
          }
          ''',
          }

          for path, content in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              cleaned = '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in content.splitlines()
              ).lstrip('\n')
              target.write_text(cleaned, encoding='utf-8')

          env_path = Path('apps/api/.env.example')
          env_text = env_path.read_text(encoding='utf-8')
          marker = 'SESSION_DOMAIN=null\n'
          addition = (
              'SESSION_DOMAIN=null\n'
              'SESSION_SECURE_COOKIE=false\n'
              'SESSION_SAME_SITE=lax\n'
              'SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000\n'
              'CORS_ALLOWED_ORIGINS=http://localhost:3000\n'
          )
          if marker not in env_text:
              raise SystemExit('session env marker missing')
          env_path.write_text(env_text.replace(marker, addition, 1), encoding='utf-8')

          compose_path = Path('compose.yaml')
          compose = compose_path.read_text(encoding='utf-8')
          marker = '      APP_URL: http://localhost:8000\n'
          addition = (
              marker
              + '      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000\n'
              + '      CORS_ALLOWED_ORIGINS: http://localhost:3000\n'
              + '      SESSION_SECURE_COOKIE: "false"\n'
              + '      SESSION_SAME_SITE: lax\n'
          )
          if marker not in compose:
              raise SystemExit('compose APP_URL marker missing')
          compose_path.write_text(compose.replace(marker, addition, 1), encoding='utf-8')
          PY
      - name: Format and validate API
        working-directory: apps/api
        run: |
          set -euo pipefail
          vendor/bin/pint
          php artisan test
          composer validate --strict
          composer audit --no-interaction
      - name: Commit identity implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api compose.yaml
          git commit -m 'feat: implement session identity and ownership'
          git push origin HEAD:feat/identity-ownership
