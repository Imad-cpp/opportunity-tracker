name: Application Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Docs quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate project documentation
        run: python3 scripts/check-docs.py

  web-quality:
    name: Web quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > /tmp/npm-audit.json
          audit_status=$?
          set -e

          if [ "${audit_status}" -eq 0 ]; then
            echo 'NPM_AUDIT=PASS'
            exit 0
          fi

          python3 - <<'PY'
          import datetime as dt
          import json
          import re
          from pathlib import Path

          expires_on = dt.date.fromisoformat('2026-08-27')
          if dt.date.today() > expires_on:
              raise SystemExit('temporary npm audit exception expired on 2026-08-27')

          audit = json.loads(Path('/tmp/npm-audit.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))

          expected_versions = {
              'next': '16.2.11',
              'postcss': '8.4.31',
              'sharp': '0.34.5',
          }
          expected_advisories = {
              'postcss': {
                  'GHSA-6g55-p6wh-862q',
                  'GHSA-fxqj-rqcc-2cmp',
                  'GHSA-qx2v-qp2m-jg93',
                  'GHSA-r28c-9q8g-f849',
              },
              'sharp': {'GHSA-f88m-g3jw-g9cj'},
          }
          expected_next_via = {'postcss', 'sharp'}

          vulnerabilities = audit.get('vulnerabilities')
          if not isinstance(vulnerabilities, dict):
              raise SystemExit('npm audit did not return the expected vulnerability object')

          gated = {
              name: details
              for name, details in vulnerabilities.items()
              if details.get('severity') in {'high', 'critical'}
          }

          if set(gated) != set(expected_versions):
              raise SystemExit(
                  f'unexpected high/critical npm vulnerabilities: {sorted(gated)}'
              )

          for package, details in gated.items():
              if details.get('severity') == 'critical':
                  raise SystemExit(f'critical vulnerability is never excepted: {package}')

              lock_entry = lock.get('packages', {}).get(f'node_modules/{package}', {})
              actual_version = lock_entry.get('version')
              if actual_version != expected_versions[package]:
                  raise SystemExit(
                      f'{package} resolved version changed: expected '
                      f'{expected_versions[package]}, got {actual_version}'
                  )

              advisory_ids = set()
              via_packages = set()
              for item in details.get('via', []):
                  if isinstance(item, str):
                      via_packages.add(item)
                      continue
                  if not isinstance(item, dict):
                      raise SystemExit(f'unexpected npm audit via entry for {package}')
                  match = re.search(r'GHSA-[0-9a-z-]+', item.get('url', ''))
                  if match is None:
                      raise SystemExit(f'unidentified advisory for {package}')
                  advisory_ids.add(match.group(0))

              if package == 'next':
                  if advisory_ids or via_packages != expected_next_via:
                      raise SystemExit(
                          f'Next.js advisory chain changed: '
                          f'advisories={sorted(advisory_ids)}, via={sorted(via_packages)}'
                      )
              else:
                  if via_packages:
                      raise SystemExit(
                          f'unexpected transitive advisory chain for {package}: '
                          f'{sorted(via_packages)}'
                      )
                  if advisory_ids != expected_advisories[package]:
                      raise SystemExit(
                          f'{package} advisory set changed: {sorted(advisory_ids)}'
                      )

          print('NPM_AUDIT=PASS_WITH_BOUNDED_UPSTREAM_EXCEPTION')
          print('NPM_AUDIT_EXCEPTION_EXPIRES=2026-08-27')
          PY

  api-quality:
    name: API quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: opportunity_tracker_test
      DB_USERNAME: opportunity
      DB_PASSWORD: opportunity_test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: opportunity_tracker_test
          POSTGRES_USER: opportunity
          POSTGRES_PASSWORD: opportunity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity -d opportunity_tracker_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifest and lock
        run: composer validate --strict
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Migrate PostgreSQL
        run: php artisan migrate --force
      - name: Check code style
        run: vendor/bin/pint --test
      - name: Run tests against PostgreSQL
        run: php artisan test
      - name: Audit Composer dependencies
        shell: bash
        run: |
          set +e
          composer audit --format=json --no-interaction > /tmp/composer-audit.json
          audit_status=$?
          set -e
          {
            echo '### Composer audit diagnostic'
            echo '```json'
            cat /tmp/composer-audit.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${audit_status}"

  stack-smoke:
    name: Docker stack smoke
    needs:
      - docs-quality
      - web-quality
      - api-quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach
      - name: Run database migrations in container
        run: docker compose exec -T api php artisan migrate --force
      - name: Verify API and web surfaces
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/health/live > /tmp/api-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color api
              exit 1
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/api-health.json').read_text())
          assert payload == {'status': 'ok'}, payload
          PY

          dashboard_status="$(curl --silent --show-error --header 'Accept: application/json' --output /tmp/dashboard-unauth.json --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/dashboard/summary)"
          if [ "${dashboard_status}" != '401' ]; then
            echo "DASHBOARD_UNAUTH_STATUS=${dashboard_status}"
            docker compose logs --no-color --tail=80 api
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/dashboard-unauth.json').read_text())
          assert payload.get('error', {}).get('code') == 'UNAUTHENTICATED', payload
          PY

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/web.html; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --no-color web
              exit 1
            fi
            sleep 2
          done

          grep -F 'Opportunity Tracker' /tmp/web.html
          grep -F 'Loading your application workspace' /tmp/web.html
          echo 'STACK_SMOKE=PASS'
      - name: Bootstrap first-party CSRF session
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --header 'Accept: application/json' \
            --header 'Origin: http://localhost:3000' \
            --cookie-jar /tmp/browser.cookies \
            --dump-header /tmp/csrf.headers \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://127.0.0.1:8000/sanctum/csrf-cookie > /tmp/csrf.status
      - name: Assert CSRF bootstrap status
        run: test "$(cat /tmp/csrf.status)" = '204'
      - name: Assert CSRF trusted CORS origin
        run: grep -i -F 'access-control-allow-origin: http://localhost:3000' /tmp/csrf.headers
      - name: Assert CSRF credentialed CORS
        run: grep -i -F 'access-control-allow-credentials: true' /tmp/csrf.headers
      - name: Submit state change without XSRF header
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --cookie /tmp/browser.cookies \
            --dump-header /tmp/login.headers \
            --output /tmp/login.json \
            --write-out '%{http_code}' \
            --data '{"email":"synthetic@example.test","password":"Synthetic-Password-123!"}' \
            http://127.0.0.1:8000/api/v1/auth/login > /tmp/login.status
      - name: Assert missing XSRF header is rejected
        run: test "$(cat /tmp/login.status)" = '419'
      - name: Assert login trusted CORS origin
        run: grep -i -F 'access-control-allow-origin: http://localhost:3000' /tmp/login.headers
      - name: Assert login credentialed CORS
        run: grep -i -F 'access-control-allow-credentials: true' /tmp/login.headers
      - name: Assert stable CSRF error envelope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/login.json').read_text())
          assert payload.get('error', {}).get('code') == 'CSRF_TOKEN_MISMATCH', payload
          PY
      - name: Show service state
        if: always()
        run: docker compose ps
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans
