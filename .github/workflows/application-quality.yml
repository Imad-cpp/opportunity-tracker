name: Generate Identity Lock

on:
  push:
    branches:
      - feat/identity-ownership
    paths:
      - .github/workflows/application-quality.yml

permissions:
  contents: write

jobs:
  lock-sanctum:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout identity branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/identity-ownership
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Resolve Sanctum
        working-directory: apps/api
        run: |
          set -euo pipefail
          composer require laravel/sanctum:^4.3 --no-interaction --no-progress
          composer validate --strict
          composer audit --no-interaction
      - name: Commit dependency lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/composer.json apps/api/composer.lock
          git commit -m 'build: add Laravel Sanctum'
          git push origin HEAD:feat/identity-ownership
