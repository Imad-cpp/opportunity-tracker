name: One-off product state fix

on:
  push:
    branches:
      - feat/v1-browser-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/v1-browser-workflows
          fetch-depth: 0
      - name: Patch edit refresh race
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/product-app.tsx')
          text = path.read_text(encoding='utf-8')

          old_reload = '''  const reload = useCallback(async () => {
            try {
              const [item, history] = await Promise.all([getOpportunity(id), getOpportunityEvents(id)]);
              setOpportunity(item);
              setStatus(item.status);
              setEvents(history);
              setError(null);
            } catch (caught) {'''
          new_reload = '''  const reload = useCallback(async (syncStatus = true) => {
            try {
              const [item, history] = await Promise.all([getOpportunity(id), getOpportunityEvents(id)]);
              setOpportunity(item);
              if (syncStatus) setStatus(item.status);
              setEvents(history);
              setError(null);
            } catch (caught) {'''

          old_saved = '''    return <OpportunityForm account={account} opportunity={opportunity} onCancel={() => setEditing(false)} onSaved={(saved) => { setOpportunity(saved); setEditing(false); void reload(); onChanged(); }} />;'''
          new_saved = '''    return <OpportunityForm account={account} opportunity={opportunity} onCancel={() => setEditing(false)} onSaved={(saved) => { setOpportunity(saved); setStatus(saved.status); setEditing(false); void reload(false); onChanged(); }} />;'''

          if text.count(old_reload) != 1:
              raise SystemExit(f'expected one reload target, found {text.count(old_reload)}')
          if text.count(old_saved) != 1:
              raise SystemExit(f'expected one edit target, found {text.count(old_saved)}')

          text = text.replace(old_reload, new_reload).replace(old_saved, new_saved)
          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/product-app.tsx
          git diff --cached --check
          git commit -m 'fix: preserve status selection after edit refresh'
          git push origin HEAD:feat/v1-browser-workflows
