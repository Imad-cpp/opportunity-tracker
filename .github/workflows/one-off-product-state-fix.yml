name: One-off product state fix

on:
  push:
    branches:
      - feat/v1-browser-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/v1-browser-workflows
          fetch-depth: 0
      - name: Patch edit refresh race
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/web/src/app/product-app.tsx')
          text = path.read_text(encoding='utf-8')

          reload_signature = '  const reload = useCallback(async () => {'
          reload_replacement = '  const reload = useCallback(async (syncStatus = true) => {'
          if text.count(reload_signature) != 1:
              raise SystemExit(f'expected one reload signature, found {text.count(reload_signature)}')
          text = text.replace(reload_signature, reload_replacement, 1)

          reload_start = text.index(reload_replacement)
          status_line = '      setStatus(item.status);'
          status_index = text.find(status_line, reload_start)
          if status_index == -1:
              raise SystemExit('reload status synchronization target not found')
          text = text[:status_index] + '      if (syncStatus) setStatus(item.status);' + text[status_index + len(status_line):]

          saved_callback = 'onSaved={(saved) => { setOpportunity(saved); setEditing(false); void reload(); onChanged(); }}'
          saved_replacement = 'onSaved={(saved) => { setOpportunity(saved); setStatus(saved.status); setEditing(false); void reload(false); onChanged(); }}'
          if text.count(saved_callback) != 1:
              raise SystemExit(f'expected one edit callback, found {text.count(saved_callback)}')
          text = text.replace(saved_callback, saved_replacement, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app/product-app.tsx
          git diff --cached --check
          git commit -m 'fix: preserve status selection after edit refresh'
          git push origin HEAD:feat/v1-browser-workflows
