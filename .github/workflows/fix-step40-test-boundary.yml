name: Fix Step 40 Test Boundary

on:
  push:
    branches:
      - feat/search-filters-deadlines
    paths:
      - .github/workflows/fix-step40-test-boundary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/search-filters-deadlines
      - name: Apply exact test-boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/Unit/DeadlineAttentionTest.php')
          text = path.read_text()
          old = 'use PHPUnit\\Framework\\TestCase;'
          new = 'use Tests\\TestCase;'
          if text.count(old) != 1:
              raise SystemExit('expected PHPUnit TestCase import exactly once')
          text = text.replace(old, new, 1)
          old2 = '        CarbonImmutable::setTestNow();\n    }'
          new2 = '        CarbonImmutable::setTestNow();\n        parent::tearDown();\n    }'
          if text.count(old2) != 1:
              raise SystemExit('expected tearDown body exactly once')
          path.write_text(text.replace(old2, new2, 1))
          PY
          php -l apps/api/tests/Unit/DeadlineAttentionTest.php
      - name: Commit fix and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-step40-test-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: boot Laravel for deadline attention model casts'
          git push origin HEAD:feat/search-filters-deadlines
