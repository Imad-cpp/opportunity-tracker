name: Refresh Stable Web Patch

on:
  push:
    branches:
      - feat/application-scaffold
    paths:
      - .github/workflows/bootstrap-scaffold-v2.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/application-scaffold-clean
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Update stable Next.js patch and validate
        working-directory: apps/web
        run: |
          npm install --save-exact next@16.2.12 eslint-config-next@16.2.12
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit stable security patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m 'fix: update stable Next.js security patch'
          git push origin HEAD:feat/application-scaffold-clean
