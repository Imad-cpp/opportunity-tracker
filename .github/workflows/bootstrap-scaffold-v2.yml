name: Apply PostgreSQL 18 Compose Fix

on:
  push:
    branches:
      - feat/application-scaffold
    paths:
      - .github/workflows/bootstrap-scaffold-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout clean PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: feat/application-scaffold-clean

      - name: Correct PostgreSQL 18 volume target
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          compose = Path('compose.yaml')
          text = compose.read_text(encoding='utf-8')
          old = 'postgres-data:/var/lib/postgresql/data'
          new = 'postgres-data:/var/lib/postgresql'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one PostgreSQL legacy volume target')
          compose.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          note = "- Corrected the PostgreSQL 18 Compose volume target to the image's version-aware parent data directory."
          body = changelog.read_text(encoding='utf-8')
          if note not in body:
              changelog.write_text(body.rstrip() + '\n' + note + '\n', encoding='utf-8')
          PY

          docker compose config --quiet

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compose.yaml CHANGELOG.md
          git commit -m 'fix: mount PostgreSQL 18 data at supported path'
          git push origin HEAD:feat/application-scaffold-clean
