services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: opportunity_tracker
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: opportunity_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: opportunity_tracker
      DB_USERNAME: opportunity
      DB_PASSWORD: opportunity_local
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$c=@file_get_contents('http://127.0.0.1:8000/api/v1/health/live'); exit($$c !== false ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
